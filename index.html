<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Comedor Canplast</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#f4f5f9;color:#1f2430}
  header{background:#3d5a99;color:#fff;padding:20px 16px}
  .marca{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  h1{font-size:20px;margin:6px 0 0;line-height:1.25}
  .sub{font-size:13px;opacity:.85;margin-top:4px}
  main{padding:12px;max-width:560px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .destacado{border-left:5px solid #3d5a99}
  h2{font-size:15px;margin:0 0 10px;color:#3d5a99}
  h3{font-size:14px;margin:0 0 6px}
  dl{margin:0;display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 12px}
  dt{font-size:11px;color:#6b7280;text-transform:uppercase;align-self:center}
  dd{margin:0;font-weight:600;font-size:14px}
  .vacio{color:#9ca3af;font-weight:400}
  .nota{font-size:12px;color:#6b7280;margin:8px 0 0}
  .aviso{background:#fff7e6;border:1px solid #f5d48a;border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 14px}
  fieldset{border:none;padding:0;margin:0 0 16px}
  legend{font-weight:600;font-size:12px;color:#3d5a99;margin-bottom:8px;text-transform:uppercase;padding:0}
  .ops{display:flex;flex-wrap:wrap;gap:8px}
  .op{position:relative}
  .op input{position:absolute;opacity:0;pointer-events:none}
  .op span{display:inline-block;padding:10px 14px;border:1.5px solid #cdd5e6;border-radius:10px;font-size:14px;background:#fff;cursor:pointer}
  .op input:checked+span{background:#3d5a99;color:#fff;border-color:#3d5a99}
  .incluye{font-size:14px;margin:0 0 14px}
  .incluye span{font-weight:600;color:#3d5a99}
  .incluye em{color:#6b7280;font-size:12px}
  .otro{width:100%;box-sizing:border-box;border:1.5px solid #3d5a99;border-radius:10px;padding:10px;font:inherit;font-size:14px;margin-top:10px}
  textarea{width:100%;box-sizing:border-box;border:1.5px solid #cdd5e6;border-radius:10px;padding:10px;font:inherit;font-size:14px;min-height:60px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#3d5a99;color:#fff;font-size:16px;font-weight:600;margin-top:8px;cursor:pointer}
  .btn:disabled{opacity:.6}
  .btn.sec{background:#fff;color:#b42318;border:1.5px solid #f1c4bf;font-size:14px}
  .estado{margin-top:12px;font-size:14px;font-weight:600}
  .estado.ok{color:#067647}
  .estado.error{color:#b42318}
  details summary{cursor:pointer;font-weight:600;color:#3d5a99;font-size:15px}
  .dia{margin-top:14px;padding-top:12px;border-top:1px solid #eceef3}
  .dia.hoy{background:#eef2fb;border-radius:8px;padding:10px;border-top:none}
  .badge{background:#3d5a99;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;vertical-align:middle}
  select{width:100%;box-sizing:border-box;border:1.5px solid #cdd5e6;border-radius:10px;padding:12px;font:inherit;font-size:15px;background:#fff}
  .btn.claro{background:#fff;color:#3d5a99;border:1.5px solid #cdd5e6;font-size:14px}
  .ok-titulo{color:#067647}
  footer{text-align:center;font-size:11px;color:#9ca3af;padding:8px 0 20px}
</style>
</head>
<body>
<header>
  <div class="marca">Comedor Canplast</div>
  <h1 id="titulo">Cargando…</h1>
  <div class="sub" id="sub"></div>
</header>
<main id="app">
  <section class="card"><p class="nota">Cargando información…</p></section>
</main>

<script>
/* Dirección del script de Apps Script (la implementación activa, termina en /exec). */
const API = 'https://script.google.com/macros/s/AKfycbzi_j8uSzRHfRtG6GZ9tY0joEztPrHjKnnm75Bvjv8koWpsI2HLMPhPrheoSIBJRKYllw/exec';

const NINGUNO = 'NINGUNO';
const OTRO = 'OTRO';
let DATOS = null;

/* ---------- utilidades ---------- */

function el(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else e.setAttribute(k, v);
    });
  }
  for (let i = 2; i < arguments.length; i++) agregar(e, arguments[i]);
  return e;
}

function agregar(padre, hijo) {
  if (hijo === null || hijo === undefined || hijo === false) return;
  if (Array.isArray(hijo)) { hijo.forEach(function (h) { agregar(padre, h); }); return; }
  padre.appendChild(typeof hijo === 'string' || typeof hijo === 'number' ? document.createTextNode(String(hijo)) : hijo);
}

function capitalizar(s) {
  s = String(s || '').toLowerCase();
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

/** Muestra los nombres como "Carmen Salomé Coutiño Mercado" en lugar de todo en mayúsculas. */
const PARTICULAS = ['de', 'del', 'la', 'las', 'los', 'y', 'e'];
function nombreBonito(n) {
  return String(n || '')
    .toLocaleLowerCase('es-MX')
    .split(/\s+/)
    .filter(Boolean)
    .map(function (p, i) {
      if (i > 0 && PARTICULAS.indexOf(p) !== -1) return p;
      return p.charAt(0).toLocaleUpperCase('es-MX') + p.slice(1);
    })
    .join(' ');
}

function etiqueta(o) {
  if (o === NINGUNO) return 'Ninguno';
  if (o === OTRO) return 'Otro';
  return o;
}

function val(nombre) {
  const e = document.getElementsByName(nombre);
  for (let i = 0; i < e.length; i++) if (e[i].checked) return e[i].value;
  return '';
}

function estado(msg, tipo) {
  const e = document.getElementById('estado');
  if (!e) return false;
  e.textContent = msg;
  e.className = 'estado ' + (tipo || '');
  return false;
}

function bloquear(b) {
  const x = document.querySelectorAll('button, select');
  for (let i = 0; i < x.length; i++) x[i].disabled = b;
}

function selectorNombres(id, nombres, alCambiar) {
  return el('select', { id: id, onchange: alCambiar || null },
    el('option', { value: '' }, '— Selecciona tu nombre —'),
    nombres.map(function (n) { return el('option', { value: n }, nombreBonito(n)); })
  );
}

/* ---------- comunicación con el script ---------- */

async function apiGet(params) {
  const r = await fetch(API + '?' + new URLSearchParams(params).toString(), {
    credentials: 'omit',
    cache: 'no-store'
  });
  return r.json();
}

async function apiPost(cuerpo) {
  const r = await fetch(API, {
    method: 'POST',
    credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  });
  return r.json();
}

/* ---------- pantallas ---------- */

function encabezado(titulo, sub) {
  document.getElementById('titulo').textContent = titulo;
  document.getElementById('sub').textContent = sub || '';
}

function limpiarApp() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  window.scrollTo(0, 0);
  return app;
}

function pantallaError(titulo, texto, reintentar) {
  encabezado(titulo, '');
  agregar(limpiarApp(), el('section', { class: 'card' },
    el('p', null, texto),
    reintentar ? el('button', { type: 'button', class: 'btn', onclick: function () { cargar(); } }, 'Reintentar') : null
  ));
}

async function cargar() {
  encabezado('Cargando…', '');
  try {
    const d = await apiGet({ accion: 'datos' });
    if (!d.ok) {
      pantallaError('Aviso', d.error || 'No se pudo cargar la información.', true);
      return;
    }
    DATOS = d;
    render();
  } catch (e) {
    pantallaError('Sin conexión', 'No se pudo cargar la información. Revisa tu conexión a internet e intenta de nuevo.', true);
  }
}

function subtitulo() {
  return capitalizar(DATOS.dia) + ' ' + DATOS.fecha + ' · Semana ' + DATOS.semana;
}

function render() {
  const d = DATOS;
  encabezado('Pedido de comida', subtitulo());
  const app = limpiarApp();

  if (!d.hayServicio) {
    agregar(app, el('section', { class: 'card' }, el('p', null, 'Hoy no hay servicio de comedor.')));
  } else if (d.abierto) {
    agregar(app, formulario());
  } else {
    agregar(app, el('section', { class: 'card destacado' },
      el('h2', null, 'Pedidos cerrados'),
      el('p', null, 'Los pedidos de hoy cerraron a las ' + d.limite + '.')
    ));
  }

  if (d.hayServicio) agregar(app, consulta());

  const info = (d.categorias || []).filter(function (c) { return c.info; });
  if (info.length) {
    agregar(app, el('section', { class: 'card' },
      el('h2', null, 'Avisos de hoy'),
      info.map(function (c) { return el('p', { class: 'nota' }, el('b', null, c.categoria + ': '), c.texto); })
    ));
  }

  agregar(app, menuSemanal());
  agregar(app, el('footer', null, 'Comedor Canplast'));
}

function grupo(titulo, nombre, opciones, extra) {
  return el('fieldset', null,
    el('legend', null, titulo),
    el('div', { class: 'ops' }, opciones.map(function (o) {
      return el('label', { class: 'op' },
        el('input', { type: 'radio', name: nombre, value: o }),
        el('span', null, etiqueta(o))
      );
    })),
    extra || null
  );
}

/** Pregunta de comida con opción "Otro" que muestra un campo para escribir. */
function grupoComida(c, i) {
  const nombre = 'cat:' + c.categoria;
  const campo = el('input', {
    type: 'text',
    id: 'otro-' + i,
    class: 'otro',
    maxlength: '80',
    placeholder: 'Escribe qué quieres de ' + c.categoria.toLowerCase()
  });
  campo.style.display = 'none';

  const fs = grupo(c.categoria, nombre, c.opciones.concat([NINGUNO, OTRO]), campo);
  fs.addEventListener('change', function () {
    const mostrar = val(nombre) === OTRO;
    campo.style.display = mostrar ? '' : 'none';
    if (mostrar) campo.focus();
  });
  return fs;
}

function formulario() {
  const d = DATOS;
  const tarjeta = el('section', { class: 'card destacado' },
    el('h2', null, 'Haz tu pedido de hoy'),
    el('p', { class: 'aviso' },
      'Pedidos hasta las ', el('b', null, d.limite), '. ',
      el('b', null, 'Una vez enviado, tu pedido ya no se puede cambiar.')
    )
  );

  if (!d.pendientes.length) {
    agregar(tarjeta, el('p', { class: 'vacio' }, 'Todos los nombres ya tienen pedido registrado hoy.'));
    return tarjeta;
  }

  const campos = [
    el('fieldset', null, el('legend', null, 'Tu nombre'), selectorNombres('nombre', d.pendientes))
  ];

  d.categorias.forEach(function (c, i) {
    if (c.info) return;
    if (!c.eleccion) {
      campos.push(el('div', { class: 'incluye' }, el('span', null, c.categoria + ': '), c.opciones[0] + ' ', el('em', null, '(incluido)')));
      return;
    }
    campos.push(grupoComida(c, i));
  });

  campos.push(grupo('¿Dónde la quieres?', 'lugar', d.lugares));
  campos.push(grupo('Horario', 'horario', d.horarios));
  campos.push(el('fieldset', null,
    el('legend', null, 'Comentarios (opcional)'),
    el('textarea', { id: 'comentarios', maxlength: '150', placeholder: 'Ej. sin frijoles, sin cebolla' })
  ));
  campos.push(el('button', { type: 'submit', class: 'btn' }, 'Enviar pedido'));
  campos.push(el('div', { id: 'estado', class: 'estado' }));

  agregar(tarjeta, el('form', { onsubmit: enviar }, campos));
  return tarjeta;
}

function listaPedido(p) {
  const filas = [['Nombre', nombreBonito(p.nombre)], ['Lugar', p.lugar], ['Horario', p.horario]]
    .concat(p.detalle || []);
  if (p.comentarios) filas.push(['Comentarios', p.comentarios]);
  if (p.registrado) filas.push(['Registrado', p.registrado.slice(11, 16)]);
  return el('dl', null, filas.map(function (x) {
    return [el('dt', null, x[0]), el('dd', null, x[1] ? etiqueta(x[1]) : el('span', { class: 'vacio' }, '—'))];
  }));
}

function consulta() {
  const d = DATOS;
  const resultado = el('div', { style: 'margin-top:12px' });
  const tarjeta = el('section', { class: 'card' }, el('h2', null, 'Consultar mi pedido de hoy'));

  if (!d.registrados.length) {
    agregar(tarjeta, el('p', { class: 'nota' }, 'Aún no hay pedidos registrados hoy.'));
    return tarjeta;
  }

  agregar(tarjeta, selectorNombres('consulta', d.registrados, async function (ev) {
    const nombre = ev.target.value;
    resultado.innerHTML = '';
    if (!nombre) return;
    agregar(resultado, el('p', { class: 'nota' }, 'Buscando…'));
    try {
      const r = await apiGet({ accion: 'consultar', nombre: nombre });
      resultado.innerHTML = '';
      if (!r.ok) return agregar(resultado, el('p', { class: 'estado error' }, r.error));
      if (!r.pedido) return agregar(resultado, el('p', { class: 'vacio' }, 'No hay pedido registrado hoy.'));
      agregar(resultado, listaPedido(r.pedido));
    } catch (e) {
      resultado.innerHTML = '';
      agregar(resultado, el('p', { class: 'estado error' }, 'No se pudo consultar. Revisa tu conexión.'));
    }
  }));
  agregar(tarjeta, resultado);
  return tarjeta;
}

function recibo(r) {
  encabezado('Pedido registrado', subtitulo());
  const app = limpiarApp();
  agregar(app, el('section', { class: 'card destacado' },
    el('h2', { class: 'ok-titulo' }, '✓ ' + r.mensaje),
    listaPedido(r.pedido),
    el('p', { class: 'aviso', style: 'margin-top:14px' }, 'Toma captura de pantalla si quieres conservar tu pedido. Ya no se puede modificar.'),
    el('button', { type: 'button', class: 'btn claro', onclick: function () { cargar(); } }, 'Volver al inicio')
  ));
}

function menuSemanal() {
  const m = DATOS.menu;
  if (!m || !m.dias.length || !m.filas.length) return null;
  return el('section', { class: 'card' },
    el('details', null,
      el('summary', null, m.titulo || 'Menú semanal'),
      m.subtitulo ? el('p', { class: 'nota' }, m.subtitulo) : null,
      m.dias.map(function (dia, j) {
        if (!dia) return null;
        return el('div', { class: 'dia' + (j === m.hoy ? ' hoy' : '') },
          el('h3', null, dia, j === m.hoy ? [' ', el('span', { class: 'badge' }, 'HOY')] : null),
          el('dl', null, m.filas.map(function (f) {
            const v = f.valores[j] || '';
            return [el('dt', null, f.categoria), el('dd', null, v || el('span', { class: 'vacio' }, '—'))];
          }))
        );
      })
    )
  );
}

/* ---------- acciones ---------- */

async function enviar(ev) {
  ev.preventDefault();
  const d = DATOS;
  const nombre = document.getElementById('nombre').value;
  if (!nombre) return estado('Selecciona tu nombre.', 'error');

  const datos = {
    lugar: val('lugar'),
    horario: val('horario'),
    comentarios: document.getElementById('comentarios').value,
    elecciones: {},
    otros: {}
  };
  for (let i = 0; i < d.categorias.length; i++) {
    const c = d.categorias[i];
    if (c.info || !c.eleccion) continue;
    const v = val('cat:' + c.categoria);
    if (!v) return estado('Falta elegir: ' + c.categoria, 'error');
    if (v === OTRO) {
      const campo = document.getElementById('otro-' + i);
      const texto = campo ? campo.value.trim() : '';
      if (!texto) {
        if (campo) campo.focus();
        return estado('Escribe qué quieres en ' + c.categoria + '.', 'error');
      }
      datos.otros[c.categoria] = texto;
    }
    datos.elecciones[c.categoria] = v;
  }
  if (!datos.lugar) return estado('Falta elegir dónde quieres tu comida.', 'error');
  if (!datos.horario) return estado('Falta elegir el horario.', 'error');

  const seguro = confirm(
    'Vas a registrar el pedido a nombre de:\n\n' + nombreBonito(nombre) +
    '\n\nUna vez enviado ya no se puede cambiar. ¿Es correcto?'
  );
  if (!seguro) return false;

  bloquear(true);
  estado('Enviando…');
  try {
    const r = await apiPost({ accion: 'guardar', nombre: nombre, datos: datos });
    if (!r.ok) {
      bloquear(false);
      return estado(r.error || 'No se pudo guardar.', 'error');
    }
    recibo(r);
  } catch (e) {
    bloquear(false);
    estado('No se pudo enviar. Revisa tu conexión e intenta de nuevo.', 'error');
  }
  return false;
}

cargar();
</script>
</body>
</html>
